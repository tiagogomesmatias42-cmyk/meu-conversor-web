<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Conversor Web Profissional</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 25px; line-height: 1.6; background-color: #f4f6f9; color: #333; }
        main { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; margin-top: 0; font-size: 24px; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .campo { margin-bottom: 25px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 16px; }
        input[type="file"], select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        button { background-color: #28a745; color: white; padding: 14px 28px; border: none; border-radius: 4px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; transition: background 0.2s; }
        button:hover { background-color: #218838; }
        p { color: #666; font-size: 14px; margin-bottom: 25px; }
    </style>
</head>
<body>
    <main>
        <h1>Conversor Web com OCR Inteligente</h1>
        <p>Interface acessível para conversão imediata de arquivos sem travar o seu navegador.</p>
        
        <form action="/converter" method="post" enctype="multipart/form-data">
            <div class="campo">
                <label for="arquivo">1. Selecione o arquivo do seu computador (PDF, JPG, PNG):</label>
                <input type="file" id="arquivo" name="arquivo" required aria-required="true">
            </div>
            
            <div class="campo">
                <label for="formato">2. Escolha para qual formato deseja converter:</label>
                <select id="formato" name="formato" required>
                    <option value="" disabled selected>Selecione um formato de saída...</option>
                    <option value="pdf_para_word">Converter documento PDF para Word (.docx)</option>
                    <option value="imagem_para_pdf">Transformar Imagem (JPG/PNG) em PDF básico</option>
                    <option value="ocr_imagem_txt">OCR: Extrair texto de Imagem para Bloco de Notas (.txt)</option>
                </select>
            </div>
            
            <button type="submit">Executar Conversão</button>
        </form>
    </main>
</body>
</html>
